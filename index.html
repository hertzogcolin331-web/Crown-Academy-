<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown Academy Test Generator</title>
    <!-- Standalone Compiled CSS Engine - Fixes Blank Layout Rendering -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- html2pdf.js CDN for direct PDF Download -->
    <script src="https://cloudflare.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts Inter -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Print styles for test and memorandum export */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .shadow-sm, .shadow-md, .shadow-lg {
                box-shadow: none !important;
            }
            .border {
                border-color: #e2e8f0 !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-900 text-white shadow-md sticky top-0 Regal-Header z-40 no-print" style="background-color: #1e1b4b;">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between" style="display: flex; height: 4rem; justify-content: space-between; align-items: center; max-width: 80rem; margin: 0 auto;">
            <!-- Logo & Title -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="showLandingPage()" style="display: flex; align-items: center; gap: 0.75rem;">
                <div class="bg-amber-400 text-indigo-950 p-2 rounded-xl flex items-center justify-center font-bold text-xl shadow" style="background-color: #fbbf24; color: #1e1b4b; padding: 0.5rem; border-radius: 0.75rem; font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid font-bold fa-crown text-amber-900 text-lg" style="color: #78350f;"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide" style="font-weight: 700; font-size: 1.125rem; line-height: 1.25;">Crown Academy</h1>
                    <p class="text-xs text-indigo-200" style="font-size: 0.75rem; color: #c7d2fe;">AI Test & Exam Generator</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-6 text-xs font-semibold text-indigo-200" style="display: flex; align-items: center; gap: 1.5rem; font-size: 0.75rem; font-weight: 600;">
                <button onclick="showLandingPage()" class="hover:text-white transition text-indigo-200">Home</button>
                <button onclick="scrollToSection('pricing')" class="hover:text-white transition text-indigo-200">Pricing</button>
                <button onclick="scrollToSection('contact')" class="hover:text-white transition text-indigo-200">Contact</button>
                <button onclick="navigateToGenerator()" class="hover:text-white transition font-bold" style="color: #fcd34d;">Generator Tool</button>
            </nav>

            <!-- Header Controls & Auth State -->
            <div class="flex items-center gap-3" style="display: flex; align-items: center; gap: 0.75rem;">
                <!-- Language Toggle -->
                <div class="bg-indigo-950 p-1 rounded-xl flex items-center border border-indigo-700" style="background-color: #0f172a; padding: 0.25rem; border-radius: 0.75rem; display: flex; align-items: center; border: 1px solid #4338ca;">
                    <button id="lang-en" onclick="setLanguage('en')" class="py-1 px-2-5 text-xs font-semibold rounded-lg flex items-center gap-1 transition bg-white text-indigo-900 shadow-sm" style="padding: 0.25rem 0.625rem; font-size: 0.75rem; font-weight: 600; border-radius: 0.5rem; background-color: white; color: #1e1b4b;">
                        🇬🇧 EN
                    </button>
                    <button id="lang-af" onclick="setLanguage('af')" class="py-1 px-2-5 text-xs font-semibold rounded-lg flex items-center gap-1 transition text-indigo-200 hover:text-white" style="padding: 0.25rem 0.625rem; font-size: 0.75rem; font-weight: 600; border-radius: 0.5rem; color: #c7d2fe;">
                        🇿🇦 AF
                    </button>
                </div>

                <!-- Logged In / Out Buttons -->
                <div id="auth-header-logged-out" class="flex items-center gap-2" style="display: flex; align-items: center; gap: 0.5rem;">
                    <button onclick="openAuthModal('login')" class="px-3 py-1-5 text-xs font-semibold rounded-xl bg-amber-400 hover:bg-amber-300 text-indigo-950 transition shadow-sm flex items-center gap-1-5" style="background-color: #fbbf24; color: #1e1b4b; padding: 0.375rem 0.75rem; font-size: 0.75rem; font-weight: 600; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.375rem;">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Log In</span>
                    </button>
                    <button onclick="openAuthModal('register')" class="px-3 py-1-5 text-xs font-semibold rounded-xl border border-indigo-700 text-indigo-200 hover:text-white transition" style="color: #c7d2fe; padding: 0.375rem 0.75rem; font-size: 0.75rem; font-weight: 600; border-radius: 0.75rem; border: 1px solid #4338ca; background: transparent;">
                        <span>Register</span>
                    </button>
                </div>

                <div id="auth-header-logged-in" class="hidden flex items-center gap-3" style="display: none; align-items: center; gap: 0.75rem;">
                    <div class="flex items-center gap-2 bg-indigo-800 px-3 py-1 rounded-xl border border-indigo-700" style="background-color: #3730a3; padding: 0.25rem 0.75rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.5rem; border: 1px solid #4338ca;">
                        <div class="w-6 h-6 rounded-full bg-amber-400 text-indigo-950 flex items-center justify-center text-xs font-bold" style="width: 1.5rem; height: 1.5rem; border-radius: 9999px; background-color: #fbbf24; color: #1e1b4b; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <span id="user-display-name" class="text-xs font-medium text-white" style="font-size: 0.75rem; font-weight: 500; color: white;">Teacher Account</span>
                        <!-- Admin Panel Button - Only visible to Admin -->
                        <button id="admin-panel-btn" onclick="openAdminModal()" class="hidden bg-amber-400 hover:bg-amber-300 text-indigo-950 text-[10px] font-extrabold px-2.5 py-1 rounded-md flex items-center gap-1 shadow transition" style="background-color: #fbbf24; color: #1e1b4b; font-size: 10px; font-weight: 800; padding: 0.25rem 0.625rem; border-radius: 0.375rem; display: none; align-items: center; gap: 0.25rem;">
                            <i class="fa-solid fa-user-gear text-amber-900" style="color: #78350f;"></i> Admin Panel
                        </button>
                        <!-- Gemini 3 Flash Badge - Only visible to Admin -->
                        <span id="admin-gemini-badge" class="hidden bg-indigo-950 text-amber-400 text-[10px] font-extrabold px-2 py-0.5 rounded-md flex items-center gap-1 border border-indigo-700" style="background-color: #0f172a; color: #fbbf24; font-size: 10px; font-weight: 800; padding: 0.125rem 0.5rem; border-radius: 0.375rem; display: none; align-items: center; gap: 0.25rem; border: 1px solid #4338ca;">
                            <i class="fa-solid fa-bolt"></i> Gemini 3 Flash
                        </span>
                    </div>
                    <button onclick="handleLogout()" class="text-xs text-indigo-300 hover:text-red-300 transition" style="font-size: 0.75rem; color: #a5b4fc;" title="Log Out">
                        <i class="fa-solid fa-power-off text-sm" style="font-size: 0.875rem;"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN APP CANVAS / LAYERS -->
    <main class="flex-1 flex flex-col" style="flex: 1 1 0%; display: flex; flex-direction: column;">
        <!-- LANDING / HOME PAGE SECTION -->
        <div id="landing-page" class="space-y-12 pb-16 no-print" style="padding-bottom: 4rem;">
            <!-- Hero Section -->
            <section class="bg-indigo-950 text-white py-16 px-4 sm:px-6 lg:px-8 text-center relative overflow-hidden" style="background: linear-to-b, #312e81, #1e1b4b; color: white; padding: 4rem 1rem; text-align: center;">
                <div class="max-w-4xl mx-auto relative z-10" style="max-width: 56rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
